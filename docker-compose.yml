services:
  backend:
    build:
      context: ./backend
    container_name: movie-backend
    environment:
      - DATABASE_URL=sqlite:////home/data/movies.db
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app:cached
      - backend-data:/data
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: movie-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  # Devcontainer “toolbox” – sem se VS Code připojí.
  # Backend + frontend poběží jako jiné služby.
  dev:
    image: mcr.microsoft.com/devcontainers/universal:2
    container_name: movie-devcontainer
    volumes:
      - .:/workspaces/movie-notebook:cached
    command: sleep infinity

volumes:
  backend-data:
